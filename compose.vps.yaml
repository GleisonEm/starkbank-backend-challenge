x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE to an approved image digest}
  env_file:
    - path: /etc/starkbank-trial/secrets/current/runtime.env
      required: true
  environment:
    STARKBANK_ENVIRONMENT: sandbox
    STARKBANK_PRIVATE_KEY_FILE: /run/secrets/starkbank_private_key
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
    STARKBANK_SANDBOX_LIVE_ENABLED: ${STARKBANK_SANDBOX_LIVE_ENABLED:-false}
    STARKBANK_WORKSPACE_ID: ${STARKBANK_WORKSPACE_ID:?set STARKBANK_WORKSPACE_ID}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FILE: /app/logs/starkbank-trial.jsonl
    MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-1048576}
    WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
    BATCH_LEASE_SECONDS: ${BATCH_LEASE_SECONDS:-300}
    RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-5}
    INVOICE_MAX_ATTEMPTS: ${INVOICE_MAX_ATTEMPTS:-5}
    INVOICE_RECONCILIATION_MAX_ATTEMPTS: ${INVOICE_RECONCILIATION_MAX_ATTEMPTS:-5}
    TRANSFER_MAX_ATTEMPTS: ${TRANSFER_MAX_ATTEMPTS:-10}
  secrets:
    - starkbank_private_key
  volumes:
    - /var/lib/starkbank-trial/logs:/app/logs
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.40
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["starkbank-trial", "db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.35
    restart: "no"

  api:
    <<: *app
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --timeout=30
      - starkbank_trial.http:create_app()
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 384m
    cpus: 0.55

  worker:
    <<: *app
    command: ["starkbank-trial", "worker", "run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.35

  scheduler:
    <<: *app
    command: ["supercronic", "/app/infra/supercronic/crontab"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: 0.15

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

secrets:
  postgres_password:
    file: /etc/starkbank-trial/secrets/current/postgres-password
  starkbank_private_key:
    file: /etc/starkbank-trial/secrets/current/starkbank-private-key.pem

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
