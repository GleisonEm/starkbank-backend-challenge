[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "starkbank-trial"
version = "0.1.0"
description = "Reliable Flask integration for the Stark Bank backend trial"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "faker>=37,<40",
    "flask>=3.1,<3.2",
    "flask-limiter>=4.1,<5",
    "gunicorn>=23,<24",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "starkbank==2.35.0",
    "structlog>=25,<26",
    "typer>=0.16,<1",
]

[project.scripts]
starkbank-trial = "starkbank_trial.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.32,<2",
    "build>=1.3,<2",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/starkbank_trial"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "typings"
packages = ["starkbank_trial"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
stubPath = "typings"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]
"migrations/**/*.py" = ["D", "INP001"]
"src/starkbank_trial/application/payers.py" = ["S311"]
"typings/**/*.pyi" = ["A002", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "integration: requires a PostgreSQL instance",
    "sandbox: performs opt-in calls to Stark Bank Sandbox",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["starkbank_trial"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
