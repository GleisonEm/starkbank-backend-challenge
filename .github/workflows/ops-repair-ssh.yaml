name: ops-repair-ssh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/starkbank-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/starkbank-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/starkbank-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/starkbank-ssh/id_ed25519" \
            "$RUNNER_TEMP/starkbank-ssh/known_hosts"
          cat > /tmp/diagnose.sh <<'SCRIPT'
          set -x
          fail2ban-client status sshd || true
          fail2ban-client unban 168.205.36.79 || true
          ufw status numbered | head -30 || true
          systemctl is-active ssh || systemctl is-active sshd || true
          ss -tlnp | grep ':22' || true
          SCRIPT
          chmod +x /tmp/diagnose.sh
          ssh -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/starkbank-ssh/known_hosts" \
            -i "$RUNNER_TEMP/starkbank-ssh/id_ed25519" \
            "$VPS_USER@$VPS_HOST" 'sudo bash -s' < /tmp/diagnose.sh
